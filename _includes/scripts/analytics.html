{%- if site.enable_google_analytics and jekyll.environment == "production" -%}
<!-- Google Analytics - Delayed load -->
<script>
  window.addEventListener('load', function() {
    setTimeout(function() {
      var script = document.createElement('script');
      script.src = 'https://www.googletagmanager.com/gtag/js?id={{ site.ga4_analytics }}';
      script.async = true;
      document.head.appendChild(script);

      script.onload = function() {
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', '{{ site.ga4_analytics }}');
      };
    }, 3000);
  });
</script>
{%- endif -%}
