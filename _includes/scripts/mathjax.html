{%- if site.enable_math and page.enable_math -%}
<script type="text/javascript">
  window.MathJax = {
    tex: { tags: 'ams' },
    startup: {
      pageReady: () => {
        return MathJax.startup.defaultPageReady();
      }
    }
  };

  window.addEventListener('load', function() {
    setTimeout(function() {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/mathjax@{{ site.mathjax.version }}/es5/tex-mml-chtml.js';
      script.async = true;
      document.head.appendChild(script);
    }, 5);
  });
</script>
{%- endif %}
