{%- if site.enable_math and page.enable_math -%}
<script type="text/javascript">
  window.MathJax = {
    tex: { tags: 'ams' },
    startup: {
      pageReady: () => {
        return MathJax.startup.defaultPageReady().then(() => {
          fitDisplayMath();
          let resizeTimer;
          window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(fitDisplayMath, 150);
          });
        });
      }
    }
  };

  // Equations wider than the screen scroll horizontally; start them at the centre.
  function fitDisplayMath() {
    document.querySelectorAll('mjx-container[display="true"]').forEach((el) => {
      el.scrollLeft = Math.max(0, (el.scrollWidth - el.clientWidth) / 2);
    });
  }

  window.addEventListener('load', function() {
    setTimeout(function() {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/mathjax@{{ site.mathjax.version }}/es5/tex-mml-chtml.js';
      script.async = true;
      document.head.appendChild(script);
    }, 5);
  });
</script>
{%- endif %}
