<div class="repo p-2 text-center">
  <a href="https://github.com/{{ include.username }}">
    <img class="repo-img-light w-100" alt="{{ include.username }}"
         src="https://github-readme-stats-nu-virid-18.vercel.app/api/?username={{ include.username }}&theme={{ site.repo_theme_light }}&show_icons=true&rank_icon=github">
    <img class="repo-img-dark w-100" alt="{{ include.username }}"
         src="https://github-readme-stats-nu-virid-18.vercel.app/api/?username={{ include.username }}&theme={{ site.repo_theme_dark }}&show_icons=true&rank_icon=github">
  </a>
</div>


<div class="repo repo-languages p-2 text-center">
  <a href="https://github.com/{{ include.username }}">
    <img class="repo-img-light w-100" alt="{{ include.username }} top languages"
        src="https://github-readme-stats-nu-virid-18.vercel.app/api/top-langs/?username={{ include.username }}&theme={{ site.repo_theme_light }}&layout=normal&hide=html,css,jupyter%20notebook,scss,typescript,less,php,tex,ruby,javascript&langs_count=3&card_width=490&size_weight=0&count_weight=0.9">
    <img class="repo-img-dark w-100" alt="{{ include.username }} top languages"
         src="https://github-readme-stats-nu-virid-18.vercel.app/api/top-langs/?username={{ include.username }}&theme={{ site.repo_theme_dark }}&layout=normal&hide=html,css,jupyter%20notebook,scss,typescript,less,php,tex,ruby,javascript&langs_count=3&card_width=490&size_weight=0&count_weight=0.9">
  </a>
</div>
